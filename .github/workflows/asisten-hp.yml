name: Build Asisten HP (APK)

on:
  push:
    paths:
      - "_lainnya/asisten-hp/**"
      - ".github/workflows/asisten-hp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: _lainnya/asisten-hp
    env:
      # AGP mengambil debug.keystore dari folder ini.
      ANDROID_USER_HOME: /home/runner/.android-user
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu-latest sudah membawa Android SDK (ANDROID_HOME); platform yang kurang diunduh otomatis oleh Gradle.
      - name: Cek Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # Kunci tanda tangan debug yang sama dipakai ulang, supaya APK baru bisa
      # dipasang menimpa versi lama tanpa uninstall (pengaturan & API key tetap).
      - name: Ambil kunci debug dari cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.android-user/debug.keystore
          key: asisten-hp-debug-keystore-v2

      - name: Buat kunci debug (kalau belum ada)
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: gradle assembleDebug lintDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: asisten-hp-apk
          path: _lainnya/asisten-hp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
